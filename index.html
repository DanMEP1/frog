<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Artifact - Frog Canvas Simulator</title>
    <style>
        :root {
            --bg-canvas: #f4f1ea;
            --bg-panel: #ffffff;
            --text-dark: #1b1b18;
            --text-gray: #6e6d65;
            --border: #e3dec3;
            --claude-green: #365942;
            --claude-green-light: #e8efe9;
            --accent-orange: #c9623b;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #faf9f5;
            color: var(--text-dark);
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(27,27,24,0.03);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        h1 { font-size: 18px; font-weight: 500; color: var(--text-dark); }
        
        .version { font-size: 11px; color: var(--text-gray); background: var(--bg-canvas); padding: 2px 6px; border-radius: 4px; }

        /* Векторный интерактивный холст в стиле графики Claude */
        .canvas-container {
            width: 100%;
            height: 240px;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        svg { width: 100%; height: 100%; }

        /* Математические SVG-анимации состояний лягушки */
        .frog-body { transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: 300px 170px; }
        
        /* Стилизация внутренних элементов вектора */
        .skin { fill: var(--claude-green); transition: fill 0.3s; }
        .skin-light { fill: #487557; }
        .belly { fill: #d5e3d7; }
        .eye-white { fill: #ffffff; }
        .eye-pupil { fill: var(--text-dark); transition: transform 0.2s; }
        .blush { fill: #e3b1a1; opacity: 0.6; }
        .tongue { stroke: var(--accent-orange); stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 200; stroke-dashoffset: 200; }

        /* CSS-Классы триггеров анимаций графики */
        .jump .frog-body { transform: translateY(-50px) scaleY(1.1) scaleX(0.95); }
        .eat .tongue { animation: tongueShoot 0.4s ease-in-out forwards; }
        .croak .frog-body { transform: scale(1.1); }
        .croak .belly { fill: #ebf5ed; }
        .sleep .eye-pupil { transform: scaleY(0.1); transform-origin: center; }

        @keyframes tongueShoot {
            0% { stroke-dashoffset: 200; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 200; }
        }

        /* Анимированные элементы окружения */
        .fly { fill: #3a3a37; transition: opacity 0.2s; }
        .reed { stroke: #b0aa90; stroke-width: 2; fill: none; transform-origin: bottom; animation: sway 4s ease-in-out infinite alternate; }
        .lilypad { fill: #b8c4b1; }

        @keyframes sway {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(3deg); }
        }
        /* Метрики и Системные Компоненты */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .metric-label { color: var(--text-gray); font-weight: 400; }
        .metric-value { color: var(--text-dark); font-weight: 500; font-variant-numeric: tabular-nums; }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #edeae0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--claude-green);
            width: 100%;
            transition: width 0.4s ease, background 0.4s ease;
        }

        .progress-bar-fill.warning { background: #ba833c; }
        .progress-bar-fill.danger { background: var(--accent-orange); }

        /* Кнопки в духе минимализма Антропик */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-dark);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.15s ease;
        }

        button:hover:not(:disabled) {
            background: var(--claude-green-light);
            border-color: #bccbbd;
            color: var(--claude-green);
        }

        button:disabled { opacity: 0.35; cursor: not-allowed; }

        .terminal-log {
            background: #faf9f5;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-gray);
            height: 58px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 241, 234, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active { opacity: 1; pointer-events: auto; }
        .overlay-title { font-size: 14px; font-weight: 500; color: var(--text-dark); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulation: Rana Temporaria</h1>
        <span class="version">Canvas View</span>
    </header>

    <div class="canvas-container" id="canvasContainer">
        <!-- SVG Графика — именно так рисует Claude на холсте -->
        <svg viewBox="0 0 600 240">
            <!-- Задний план: камыши и вода -->
            <path d="M 0,210 Q 300,205 600,210 L 600,240 L 0,240 Z" fill="#e8e5da"/>
            <path class="reed" d="M 80,220 Q 75,120 90,40" />
            <path class="reed" d="M 95,220 Q 100,140 92,60" />
            <path class="reed" d="M 520,220 Q 530,110 515,30" />

            <!-- Кувшинка -->
            <ellipse class="lilypad" cx="300" cy="190" rx="90" ry="18" />
            <path d="M 370,183 L 390,190 L 370,197 Z" fill="#f4f1ea" />

            <!-- Язык (Скрыт по умолчанию) -->
            <path class="tongue" id="svgTongue" d="M 300,155 Q 370,110 440,85" />

            <!-- Муха (Векторная цель) -->
            <g id="svgFly" class="fly" transform="translate(440, 85)">
                <circle cx="0" cy="0" r="4" />
                <ellipse cx="-3" cy="-4" rx="2" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(-30)" />
                <ellipse cx="3" cy="-4" rx="2" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(30)" />
            </g>
            <!-- Векторная Лягушка (Математический концепт Клода) -->
            <g class="frog-body" id="svgFrog">
                <!-- Задние лапы -->
                <path d="M 230,180 Q 210,160 225,190" stroke="var(--claude-green)" stroke-width="8" stroke-linecap="round" fill="none"/>
                <path d="M 370,180 Q 390,160 375,190" stroke="var(--claude-green)" stroke-width="8" stroke-linecap="round" fill="none"/>
                
                <!-- Тело -->
                <ellipse class="skin" cx="300" cy="165" rx="45" ry="32" />
                <ellipse class="belly" cx="300" cy="172" rx="32" ry="20" />
                
                <!-- Голова -->
                <ellipse class="skin" cx="300" cy="135" rx="38" ry="26" />
                
                <!-- Глаза -->
                <circle class="skin" cx="280" cy="114" r="11" />
                <circle class="eye-white" cx="280" cy="114" r="8" />
                <circle class="eye-pupil" id="pupilL" cx="280" cy="114" r="4" />

                <circle class="skin" cx="320" cy="114" r="11" />
                <circle class="eye-white" cx="320" cy="114" r="8" />
                <circle class="eye-pupil" id="pupilR" cx="320" cy="114" r="4" />

                <!-- Щечки и рот -->
                <circle class="blush" cx="274" cy="142" r="5" />
                <circle class="blush" cx="326" cy="142" r="5" />
                <path d="M 288,144 Q 300,150 312,144" stroke="#2b4234" stroke-width="2" stroke-linecap="round" fill="none" />
                
                <!-- Передние лапки -->
                <line x1="280" y1="185" x2="275" y2="200" stroke="var(--claude-green)" stroke-width="5" stroke-linecap="round"/>
                <line x1="320" y1="185" x2="325" y2="200" stroke="var(--claude-green)" stroke-width="5" stroke-linecap="round"/>
            </g>
        </svg>

        <div class="overlay" id="endOverlay">
            <div class="overlay-title" id="endReason">Симуляция завершена</div>
            <button onclick="restart()">Инициализировать заново</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="metric-block">
            <div class="metric-row">
                <span class="metric-label">Метаболизм (Энергия)</span>
                <span class="metric-value" id="valEnergy">100%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="barEnergy"></div></div>
        </div>

        <div class="metric-block">
            <div class="metric-row">
                <span class="metric-label">Биомасса (Сытость)</span>
                <span class="metric-value" id="valHunger">100%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="barHunger"></div></div>
        </div>

        <div class="metric-block">
            <div class="metric-row">
                <span class="metric-label">Гидробаланс (Влажность)</span>
                <span class="metric-value" id="valMoisture">100%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="barMoisture"></div></div>
        </div>
    </div>

    <div class="control-grid">
        <button id="btn1" onclick="triggerAction('eat')">Сбор биомассы (Язык)</button>
        <button id="btn2" onclick="triggerAction('jump')">Смена позиции (Прыжок)</button>
        <button id="btn3" onclick="triggerAction('croak')">Акустический импульс</button>
        <button id="btn4" onclick="triggerAction('sleep')">Режим энергосбережения</button>
    </div>

    <div class="terminal-log" id="termLog">> Инициализация математической модели... Готово.</div>
</div>

<script>
    let model = { energy: 100, hunger: 100, moisture: 100, alive: true };
    let flyState = { x: 440, y: 85 };

    // Естественное поведение глаз (Векторный следящий фокус Клода)
    document.addEventListener('mousemove', (e) => {
        if (!model.alive) return;
        const pL = document.getElementById('pupilL');
        const pR = document.getElementById('pupilR');
        const bounds = document.getElementById('canvasContainer').getBoundingClientRect();
        const mouseX = e.clientX - (bounds.left + bounds.width / 2);
        const dx = mouseX > 0 ? 1.5 : -1.5;
        pL.style.transform = `translateX(${dx}px)`;
        pR.style.transform = `translateX(${dx}px)`;
    });
    function triggerAction(action) {
        if (!model.alive) return;
        const canvas = document.getElementById('canvasContainer');
        
        if (action === 'eat') {
            canvas.className = 'canvas-container eat';
            model.hunger = Math.min(100, model.hunger + 25);
            model.energy = Math.max(0, model.energy - 8);
            
            // Расчет траектории подтягивания мухи к языку
            const t = document.getElementById('svgTongue');
            t.setAttribute('d', `M 300,135 Q 370,${flyState.y - 20} ${flyState.x},${flyState.y}`);
            
            setTimeout(() => { document.getElementById('svgFly').style.opacity = '0'; }, 150);
            setTimeout(() => { moveFly(); document.getElementById('svgFly').style.opacity = '1'; }, 800);
            log('Захвачен объект типа [Insect]. Энергия переработана в биомассу.');
        } 
        else if (action === 'jump') {
            canvas.className = 'canvas-container jump';
            model.energy = Math.max(0, model.energy - 20);
            model.moisture = Math.max(0, model.moisture - 15);
            log('Перемещение выполнено успешно. Зафиксирован расход влаги.');
        } 
        else if (action === 'croak') {
            canvas.className = 'canvas-container croak';
            model.energy = Math.max(0, model.energy - 5);
            log('Сгенерирован звуковой сигнал частотой 450Гц.');
        } 
        else if (action === 'sleep') {
            canvas.className = 'canvas-container sleep';
            model.energy = Math.min(100, model.energy + 30);
            model.moisture = Math.min(100, model.moisture + 10);
            model.hunger = Math.max(0, model.hunger - 10);
            log('Система переведена в состояние сна. Метрики оптимизированы.');
        }

        setTimeout(() => { if (model.alive) canvas.className = 'canvas-container'; }, 400);
        update();
    }

    function moveFly() {
        flyState.x = Math.floor(Math.random() * 120) + 400;
        flyState.y = Math.floor(Math.random() * 80) + 50;
        document.getElementById('svgFly').setAttribute('transform', `translate(${flyState.x}, ${flyState.y})`);
    }

    // Пассивное угасание систем жизнеобеспечения
    setInterval(() => {
        if (!model.alive) return;
        model.energy = Math.max(0, model.energy - 2);
        model.hunger = Math.max(0, model.hunger - 3);
        model.moisture = Math.max(0, model.moisture - 4);
        
        if(Math.random() > 0.7) moveFly();
        update();
    }, 2000);

    function update() {
        document.getElementById('valEnergy').innerText = model.energy + '%';
        document.getElementById('valHunger').innerText = model.hunger + '%';
        document.getElementById('valMoisture').innerText = model.moisture + '%';

        renderBar('barEnergy', model.energy);
        renderBar('barHunger', model.hunger);
        renderBar('barMoisture', model.moisture);

        if (model.energy <= 0 || model.hunger <= 0 || model.moisture <= 0) {
            model.alive = false;
            document.getElementById('endOverlay').classList.add('active');
            document.getElementById('svgFrog').style.opacity = '0.3';
            log('Критический системный сбой: Агент деактивирован.');
            toggleButtons(true);
        }
    }

    function renderBar(id, val) {
        const bar = document.getElementById(id);
        bar.style.width = val + '%';
        bar.classList.remove('warning', 'danger');
        if (val <= 20) bar.classList.add('danger');
        else if (val <= 50) bar.classList.add('warning');
    }

    function log(msg) {
        const l = document.getElementById('termLog');
        l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    function toggleButtons(status) {
        for(let i=1; i<=4; i++) document.getElementById('btn'+i).disabled = status;
    }

    function restart() {
        model = { energy: 100, hunger: 100, moisture: 100, alive: true };
        document.getElementById('endOverlay').classList.remove('active');
        document.getElementById('svgFrog').style.opacity = '1';
        toggleButtons(false);
        log('Система перезагружена. Параметры нормализованы.');
        update();
    }

    update();
</script>
</body>
</html>
